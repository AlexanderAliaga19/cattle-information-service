name: Java CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ichu
          POSTGRES_USER: ichu
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ichu -d ichu"
          --health-interval 5s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B verify
      - run: mvn -B test -Dspring.profiles.active=postgres-test
        env:
          DB_URL: jdbc:postgresql://localhost:5432/ichu
          DB_USER: ichu
          DB_PASSWORD: ci-only-password
